<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12100c">
  <meta name="description" content="Гитарный тюнер: свои строи, шесть струн и распознавание ноты в браузере.">
  <title>Tuner — гитарный тюнер</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <div class="app">
    <main id="view-tuner" class="view">
      <header class="top">
        <div>
          <h1>Tuner</h1>
          <button type="button" id="tuning-name" class="tuning-name">Стандарт</button>
        </div>
      </header>
      <div class="actions">
        <button type="button" class="chip" id="library-btn">Строи</button>
        <button type="button" class="chip" id="notes-btn">Ноты</button>
        <button type="button" class="chip" id="hz-btn" aria-pressed="false">Hz</button>
        <span class="pair">
          <button type="button" class="chip" id="fret-down">− лад</button>
          <button type="button" class="chip" id="fret-up">+ лад</button>
        </span>
      </div>
      <section id="hero" aria-label="Тюнер" hidden>
        <p id="hero-note" class="hero-note"></p>
        <p id="hero-heard" class="heard" hidden></p>
        <p id="hero-dir" class="dir idle"></p>
        <p id="hero-cents" class="cents" hidden></p>
        <div id="meter" class="meter" hidden>
          <div class="meter-track">
            <div class="meter-line"></div>
            <div class="zone"></div>
            <div id="needle" class="needle"></div>
          </div>
          <div class="meter-scale"><span>−50</span><span>0</span><span>+50</span></div>
        </div>
        <p id="hero-hz" class="hz" hidden></p>
      </section>
      <p id="legend" class="legend">Отклонение от стандарта, в ладах.<span class="kbd-hint"> Клавиши 1–6 играют струны слева направо.</span></p>
      <div id="empty-state" class="empty-state" hidden>
        <p>Нет сохранённого строя</p>
        <button type="button" id="empty-create">Новый строй</button>
      </div>
      <div id="board" class="board" role="group" aria-label="Шесть струн. Коснитесь самой струны, чтобы услышать ноту.">
        <div id="strings" class="strings"></div>
      </div>
    </main>

    <main id="view-library" class="view" hidden>
      <header class="bar">
        <button type="button" class="linkish" id="library-back">Тюнер</button>
        <h2>Строи</h2>
        <button type="button" class="save" id="new-tuning">Новый</button>
      </header>
      <div id="library-list"></div>
    </main>

    <main id="view-editor" class="view" hidden>
      <header class="bar">
        <button type="button" class="linkish" id="editor-back">Назад</button>
        <h2>Строй</h2>
        <button type="button" class="save" id="save-tuning">Сохранить</button>
      </header>
      <div id="editor-scroll">
        <label class="hint" for="editor-name">Название</label>
        <input id="editor-name" class="field" maxlength="40" autocomplete="off" placeholder="Например, Drop C">
        <p class="hint">Диезы стоят между основными нотами. Ими тоже можно собрать строй.</p>
        <div id="editor-body"></div>
      </div>
    </main>
  </div>

  <div id="notes-layer" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="notes-title">
      <div class="notes-head">
        <h2 id="notes-title">Ноты</h2>
        <button type="button" id="notes-close" aria-label="Закрыть">×</button>
      </div>
      <p class="hint">Все ноты по порядку, от низких к высоким. Звучащая подсвечивается.</p>
      <div id="note-list" class="note-list"></div>
    </div>
  </div>

  <div id="dialog" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Удалить строй?</h2>
      <p id="dialog-body"></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-cancel">Отмена</button>
        <button type="button" id="dialog-ok" class="danger-btn">Удалить</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <p id="live-region" class="sr-only" aria-live="polite"></p>

  <script src="js/music.js?v=3"></script>
  <script src="js/pitch-core.js?v=3"></script>
  <script src="js/synth-core.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
